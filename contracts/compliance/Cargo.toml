[package]
name = "comebackhere-compliance"
version = "1.0.0"
edition = "2021"
license.workspace = true
publish = false
description = "COMEBACKHERE compliance gating contract"
keywords = ["soroban", "stellar", "compliance"]
categories = ["cryptography::cryptocurrencies"]

[lib]
crate-type = ["cdylib", "rlib"]
name = "compliance"

[features]
testutils = ["soroban-sdk/testutils"]

[dependencies]
soroban-sdk.workspace = true
compliance-errors = { package = "comebackhere-compliance-errors", path = "../../crates/compliance-errors" }
error-macros = { package = "comebackhere-error-macros", path = "../../crates/error-macros" }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
