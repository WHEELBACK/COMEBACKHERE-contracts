[package]
name = "comebackhere-fee-manager"
version = "1.0.0"
edition = "2021"
license.workspace = true
publish = false
description = "COMEBACKHERE fee manager contract"
keywords = ["soroban", "stellar", "fees"]
categories = ["cryptography::cryptocurrencies"]

[lib]
crate-type = ["cdylib", "rlib"]
name = "fee_manager"

[features]
testutils = ["soroban-sdk/testutils"]

[dependencies]
soroban-sdk.workspace = true
protocol-math = { package = "comebackhere-protocol-math", path = "../../crates/protocol-math" }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
