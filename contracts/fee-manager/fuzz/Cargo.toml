[package]
name = "fee-manager-fuzz"
version = "0.0.0"
edition = "2021"
publish = false

[package.metadata]
cargo-fuzz = true

# Standalone workspace: kept out of the root workspace so `cargo test --all`
# and normal `cargo build` at the repo root are unaffected by the fuzz crate,
# which requires the nightly toolchain + cargo-fuzz to build/run.
[workspace]

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = { version = "1", features = ["derive"] }
soroban-sdk = { version = "22.0.8", features = ["testutils"] }

[dependencies.fee_manager]
package = "comebackhere-fee-manager"
path = ".."
features = ["testutils"]

[[bin]]
name = "malicious_caller"
path = "fuzz_targets/malicious_caller.rs"
test = false
doc = false
bench = false
