[package]
name = "settlement-workflow-fuzz"
version = "0.0.0"
edition = "2021"
publish = false

[package.metadata]
cargo-fuzz = true

# Standalone workspace: kept out of the root workspace so `cargo test --all`
# and normal `cargo build` at the repo root are unaffected by the fuzz crate,
# which requires the nightly toolchain + cargo-fuzz to build/run.
[workspace]

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = { version = "1", features = ["derive"] }
soroban-sdk = { version = "22.0.0", features = ["testutils"] }

[dependencies.settlement_workflow]
path = ".."
features = ["testutils"]

# Real contract crates are needed to stand up actual Compliance/Treasury
# instances for the fuzz harness to drive. Unlike a deployed contract, a native
# cargo-fuzz binary links these fine (the `duplicate symbol: pause` wasm link
# failure only affects wasm builds, not native test/fuzz binaries), so pulling
# in the full implementation crates here is safe.
[dependencies.compliance]
package = "comebackhere-compliance"
path = "../../contracts/compliance"

[dependencies.treasury]
package = "comebackhere-treasury"
path = "../../contracts/treasury"

[[bin]]
name = "execute_with_compliance"
path = "fuzz_targets/execute_with_compliance.rs"
test = false
doc = false
bench = false
