[package]
name = "comebackhere-settlement-workflow"
version = "1.0.0"
edition.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]
name = "settlement_workflow"

[features]
testutils = ["soroban-sdk/testutils"]

[dependencies]
soroban-sdk.workspace = true
compliance-client = { package = "comebackhere-compliance-client", path = "../../crates/compliance-client" }
treasury = { package = "comebackhere-treasury", path = "../treasury" }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
compliance = { package = "comebackhere-compliance", path = "../compliance" }
