[package]
name = "storage-layout-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[workspace]

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = { version = "1", features = ["derive"] }
soroban-sdk = { workspace = true, features = ["testutils"] }

[dependencies.comebackhere-storage-layout]
path = ".."
features = ["testutils"]

[[bin]]
name = "malicious_caller"
path = "fuzz_targets/malicious_caller.rs"
test = false
doc = false
bench = false