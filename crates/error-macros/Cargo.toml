[package]
name = "comebackhere-error-macros"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Shared declare_contract_error! macro for COMEBACKHERE contracterror enums"
keywords = ["soroban", "stellar", "errors", "macros"]
categories = ["development-tools::build-utils"]

[lib]
name = "error_macros"

[features]
testutils = ["soroban-sdk/testutils"]

[dependencies]
soroban-sdk.workspace = true

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
