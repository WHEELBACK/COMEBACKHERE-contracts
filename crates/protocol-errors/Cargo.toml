[package]
name = "comebackhere-protocol-errors"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Aggregated protocol error compatibility checks for COMEBACKHERE"
keywords = ["soroban", "stellar", "errors"]
categories = ["development-tools::testing"]

[lib]
name = "protocol_errors"

[dependencies]
invoice-errors  = { package = "comebackhere-invoice-errors",  path = "../../crates/invoice-errors" }
treasury        = { package = "comebackhere-treasury",        path = "../../contracts/treasury" }
compliance-errors = { package = "comebackhere-compliance-errors", path = "../../crates/compliance-errors" }

[dev-dependencies]
soroban-sdk.workspace = true
