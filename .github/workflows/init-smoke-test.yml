name: Init Contracts Smoke Test

on:
  pull_request:
    paths:
      - "contracts/**"
      - "scripts/init-contracts.sh"
      - "scripts/check-tools.sh"
      - ".github/workflows/init-smoke-test.yml"
  push:
    branches: [main]
    paths:
      - "contracts/**"
      - "scripts/init-contracts.sh"
      - "scripts/check-tools.sh"

env:
  CARGO_TERM_COLOR: always

jobs:
  init-smoke-test:
    runs-on: ubuntu-latest

    services:
      stellar:
        # Pinned rather than `latest`: `latest` tracks the newest protocol
        # (28 at the time of pinning), whose XDR the pinned stellar-cli
        # (STELLAR_CLI_VERSION in .github/versions.env, 22.x) can't parse
        # ("xdr value invalid"). v480 runs stellar-core 22.3.0 / protocol 22.
        # Bump together with the CLI pin.
        image: stellar/quickstart:v480-latest
        ports:
          - 8000:8000
        env:
          ENABLE_SOROBAN_RPC: "true"
          NETWORK: local
          # The default testnet-like limits cap contract size at 64 KB, which
          # the (unoptimized) treasury wasm exceeds (TxSorobanInvalid on
          # install). This job smoke-tests the init flow, not network limits;
          # contract-size.yml gates size separately.
          LIMITS: unlimited
        options: >-
          --health-cmd "curl -sf http://localhost:8000/health"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - name: Load version pins
        shell: bash
        run: |
          set -a
          source .github/versions.env
          set +a
          echo "RUST_VERSION=$RUST_VERSION" >> "$GITHUB_ENV"
          echo "STELLAR_CLI_VERSION=$STELLAR_CLI_VERSION" >> "$GITHUB_ENV"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: wasm32-unknown-unknown

      - name: Install stellar-cli build dependencies
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev libudev-dev pkg-config binaryen

      - name: Install Stellar CLI (pinned)
        run: cargo install --locked stellar-cli --version "$STELLAR_CLI_VERSION"

      - name: Verify toolchain and environment with check-tools.sh
        run: bash scripts/check-tools.sh

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Run init-contracts.sh
        run: bash scripts/init-contracts.sh

      - name: Run cargo test --all
        run: cargo test --all
