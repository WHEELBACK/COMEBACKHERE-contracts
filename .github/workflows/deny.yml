name: Deny

on:
  pull_request:
    branches: [main]
  schedule:
    # Weekly, Monday 06:00 UTC. Catches new advisories published for
    # dependencies that are already pinned in Cargo.lock, since those have
    # no PR/push to trigger the `deny` job above.
    - cron: "0 6 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  deny:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories licenses

  scheduled-advisory-recheck:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4

      - name: Check advisories against Cargo.lock
        id: deny_check
        uses: EmbarkStudios/cargo-deny-action@v2
        continue-on-error: true
        with:
          command: check advisories

      - name: Open or update issue on new advisory
        if: steps.deny_check.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              "The weekly scheduled cargo-deny re-check found an advisory affecting",
              "a dependency pinned in `Cargo.lock`, even though nothing changed in",
              "this repo — the advisory database was updated.",
              "",
              `Run: ${runUrl}`,
              "",
              "Run `cargo deny check advisories` locally (or inspect the run log above)",
              "to see the affected crate(s), then either upgrade the dependency or add",
              "a documented `ignore` entry in `deny.toml` if it isn't actionable from",
              "this repo.",
            ].join("\n");

            const label = "cargo-deny-advisory";
            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: label,
            });

            if (existing.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing[0].number,
                body: `Still failing as of this run.\n\n${body}`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: "cargo-deny: new advisory affecting a pinned dependency",
                body,
                labels: [label],
              });
            }

      - name: Fail loudly
        if: steps.deny_check.outcome == 'failure'
        run: |
          echo "::error::cargo-deny found a new advisory affecting a pinned dependency in Cargo.lock. See the opened/updated GitHub issue for details."
          exit 1
