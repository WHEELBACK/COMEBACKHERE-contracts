name: WASM Build Check

on:
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  SOROBAN_SDK_BUILD_SYSTEM_SUPPORTS_SPEC_SHAKING_V2: "1"

jobs:
  wasm-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Load version pins
        shell: bash
        run: |
          set -a
          source .github/versions.env
          set +a
          echo "RUST_VERSION=$RUST_VERSION" >> "$GITHUB_ENV"
          echo "STELLAR_CLI_VERSION=$STELLAR_CLI_VERSION" >> "$GITHUB_ENV"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: wasm32v1-none

      - name: Cache Stellar CLI binary
        id: cache-stellar-cli
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/stellar
          key: ${{ runner.os }}-stellar-cli-${{ env.STELLAR_CLI_VERSION }}

      - name: Install stellar-cli build dependencies
        if: steps.cache-stellar-cli.outputs.cache-hit != 'true'
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev libudev-dev pkg-config

      - name: Install Stellar CLI (pinned)
        if: steps.cache-stellar-cli.outputs.cache-hit != 'true'
        run: cargo install --locked stellar-cli --version "$STELLAR_CLI_VERSION"

      - name: Verify Stellar CLI version
        run: |
          INSTALLED=$(stellar --version 2>&1 | head -1 | awk '{print $2}' | tr -d '[:space:]')
          if [ "$INSTALLED" != "$STELLAR_CLI_VERSION" ]; then
            echo "Expected stellar-cli $STELLAR_CLI_VERSION, got $INSTALLED"
            exit 1
          fi
          echo "✓ stellar-cli version $INSTALLED verified."

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: build

      - name: Build compliance contract (WASM)
        run: cargo build --target wasm32v1-none --release --package comebackhere-compliance

      - name: Build invoice contract (WASM)
        run: cargo build --target wasm32v1-none --release --package comebackhere-invoice

      - name: Build treasury contract (WASM)
        run: cargo build --target wasm32v1-none --release --package comebackhere-treasury

      - name: Build settlement-workflow contract (WASM)
        run: cargo build --target wasm32v1-none --release --package comebackhere-settlement-workflow
