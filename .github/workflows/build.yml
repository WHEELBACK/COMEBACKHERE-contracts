name: WASM Build Check

on:
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  STELLAR_CLI_VERSION: "22.8.2"

jobs:
  wasm-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"
          targets: wasm32-unknown-unknown

      - name: Install Stellar CLI (pinned)
        run: cargo install --locked stellar-cli --version "$STELLAR_CLI_VERSION"

      - name: Verify Stellar CLI version
        run: |
          INSTALLED=$(stellar --version | awk '{print $2}')
          if [ "$INSTALLED" != "$STELLAR_CLI_VERSION" ]; then
            echo "Expected stellar-cli $STELLAR_CLI_VERSION, got $INSTALLED"
            exit 1
          fi

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: build

      - name: Build compliance contract (WASM)
        run: cargo build --target wasm32-unknown-unknown --release -p comebackhere-compliance

      - name: Build invoice contract (WASM)
        run: cargo build --target wasm32-unknown-unknown --release -p comebackhere-invoice

      - name: Build treasury contract (WASM)
        run: cargo build --target wasm32-unknown-unknown --release -p comebackhere-treasury
