name: Contract Size

on:
  pull_request:
    paths:
      - "contracts/**"
      - "Cargo.toml"
      - "Cargo.lock"
  push:
    branches: [main]
    paths:
      - "contracts/**"
      - "Cargo.toml"
      - "Cargo.lock"
  workflow_dispatch: {}

env:
  CARGO_TERM_COLOR: always
  MAX_CONTRACT_SIZE: 65536 # 64 KB

jobs:
  check-size:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"
          targets: wasm32-unknown-unknown

      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-contract-size-${{ hashFiles('Cargo.lock') }}

      - name: Build contracts to WASM
        run: |
          set -e
          echo "=== Building contracts ==="
          for contract in contracts/*/; do
            if [ -f "$contract/Cargo.toml" ]; then
              name=$(basename "$contract")
              echo "--- Building $name ---"
              cargo build --package "comebackhere-$name" --target wasm32-unknown-unknown --release 2>&1
            fi
          done

      - name: Install wasm-opt
        run: sudo apt-get update && sudo apt-get install -y binaryen

      - name: Optimize contract WASM
        run: |
          set -e
          # Mirrors the size reduction `stellar contract optimize` performs
          # before deployment, so the measured size matches what actually
          # ships. wasm-opt only touches code/data, not the custom
          # contractspecv0/contractmetav0/contractenvmetav0 sections that
          # encode the contract's on-chain ABI.
          # --all-features: the apt-packaged wasm-opt doesn't read the
          # module's target-features custom section, so it must be told
          # about every feature LLVM's wasm32 backend may emit (sign-ext,
          # bulk-memory, etc.) rather than enabling them one by one.
          for wasm in target/wasm32-unknown-unknown/release/*.wasm; do
            wasm-opt -Oz --strip-debug --strip-dwarf --vacuum --all-features "$wasm" -o "$wasm.opt"
            mv "$wasm.opt" "$wasm"
          done

      - name: Report .wasm sizes
        run: |
          set -e
          echo "### Contract WASM sizes" >> $GITHUB_STEP_SUMMARY
          echo '| Contract | Size (bytes) | Status |' >> $GITHUB_STEP_SUMMARY
          echo '|----------|-------------|--------|' >> $GITHUB_STEP_SUMMARY
          EXIT_CODE=0
          for wasm in target/wasm32-unknown-unknown/release/*.wasm; do
            name=$(basename "$wasm" .wasm)
            size=$(stat --format=%s "$wasm")
            # treasury gets a temporarily raised threshold while the Result-refactor
            # series (#386/#387/#388) lands; revert to MAX_CONTRACT_SIZE once complete.
            if [ "$name" = "treasury" ]; then
              limit=75000
            else
              limit="$MAX_CONTRACT_SIZE"
            fi
            if [ "$size" -gt "$limit" ]; then
              status=":x: Exceeds ${limit} bytes"
              EXIT_CODE=1
            else
              status=":white_check_mark: OK"
            fi
            echo "| $name | $size | $status |" >> $GITHUB_STEP_SUMMARY
            echo "$name: ${size} bytes"
          done
          exit $EXIT_CODE

  wasm-size-regression:
    runs-on: ubuntu-latest
    needs: check-size
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"
          targets: wasm32-unknown-unknown

      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-contract-size-${{ hashFiles('Cargo.lock') }}

      - name: Build treasury contract to WASM
        run: |
          set -e
          cargo build --package comebackhere-treasury --target wasm32-unknown-unknown --release

      - name: Install wasm-opt
        run: sudo apt-get update && sudo apt-get install -y binaryen

      - name: Optimize treasury WASM
        run: |
          set -e
          wasm=target/wasm32-unknown-unknown/release/treasury.wasm
          wasm-opt -Oz --strip-debug --strip-dwarf --vacuum --all-features "$wasm" -o "$wasm.opt"
          mv "$wasm.opt" "$wasm"

      - name: Check wasm size regression
        run: bash scripts/check-wasm-size.sh target/wasm32-unknown-unknown/release/treasury.wasm
