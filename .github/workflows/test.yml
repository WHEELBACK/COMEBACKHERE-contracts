name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, Tuesday 06:00 UTC. Tests against the latest available soroban-sdk
    # 22.x patch to catch upstream regressions before they reach a Dependabot PR.
    - cron: "0 6 * * 2"
  workflow_dispatch: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Load version pins
        shell: bash
        run: |
          set -a
          source .github/versions.env
          set +a
          echo "RUST_VERSION=$RUST_VERSION" >> "$GITHUB_ENV"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: wasm32-unknown-unknown

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: test-pinned

      - name: Run tests
        run: cargo test --workspace

      - name: Check test snapshot drift
        run: |
          snapshot_status="$(git status --porcelain -- ':(glob)**/test_snapshots/*.json' ':(glob)**/tests/snapshots/*.snap')"
          if [ -n "$snapshot_status" ]; then
            echo "$snapshot_status"
            echo "Test snapshots changed during CI. Regenerate and commit the matching snapshots."
            exit 1
          fi

  mutants-treasury:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Load version pins
        shell: bash
        run: |
          set -a
          source .github/versions.env
          set +a
          echo "RUST_VERSION=$RUST_VERSION" >> "$GITHUB_ENV"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: wasm32-unknown-unknown

      - name: Install cargo-mutants
        run: cargo install cargo-mutants

      - name: Run treasury mutation tests
        run: cargo mutants --package comebackhere-treasury --timeout 60 --test-threads 1 --in-place --no-shuffle --list-test-cases --exclude "contracts/treasury/tests/" || true

  # Non-blocking early-warning job: runs the same suite against whatever
  # Rust currently reports as "stable", so a breakage caused by an upcoming
  # toolchain bump surfaces here before rust-toolchain.toml is ever touched.
  # This job is not a required check — the pinned `test` job above is what
  # gates merges.
  test-next-stable:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: test-stable

      - name: Run tests
        run: cargo test --workspace

  # Non-blocking early-warning job: runs the same suite against the latest
  # available soroban-sdk 22.x patch release, catching upstream regressions
  # in patch versions before they reach a Dependabot PR attempt. This job is
  # not a required check — the pinned `test` job above is what gates merges.
  test-latest-soroban-22x:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Load version pins
        shell: bash
        run: |
          set -a
          source .github/versions.env
          set +a
          echo "RUST_VERSION=$RUST_VERSION" >> "$GITHUB_ENV"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: wasm32-unknown-unknown

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: test-latest-soroban-22x

      - name: Update soroban-sdk to latest 22.x patch
        run: cargo update -p soroban-sdk

      - name: Run tests
        run: cargo test --all

      - name: Run clippy
        run: cargo clippy -- -D warnings

      - name: Check formatting
        run: cargo fmt --all -- --check

  # Non-blocking matrix job: runs the test suite against a small set of
  # pinned soroban-sdk 22.x patch versions to catch any subtle behavior changes
  # or regressions introduced in patch-level updates that might otherwise slip
  # through as safe by virtue of being patch versions. This job is not a required
  # check — the pinned `test` job above is what gates merges.
  test-soroban-sdk-22x-matrix:
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      matrix:
        soroban-version: ["22.0.0", "22.0.5", "22.0.11"]
    steps:
      - uses: actions/checkout@v4

      - name: Load version pins
        shell: bash
        run: |
          set -a
          source .github/versions.env
          set +a
          echo "RUST_VERSION=$RUST_VERSION" >> "$GITHUB_ENV"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: wasm32-unknown-unknown

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: test-soroban-sdk-matrix-${{ matrix.soroban-version }}

      - name: Update soroban-sdk to ${{ matrix.soroban-version }}
        run: cargo update -p soroban-sdk --precise ${{ matrix.soroban-version }}

      - name: Run tests
        run: cargo test --all

      - name: Run clippy
        run: cargo clippy -- -D warnings

      - name: Check formatting
        run: cargo fmt --all -- --check
