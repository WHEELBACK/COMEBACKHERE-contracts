name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"
          targets: wasm32-unknown-unknown

      - name: Run tests
        run: cargo test --workspace

  # Non-blocking early-warning job: runs the same suite against whatever
  # Rust currently reports as "stable", so a breakage caused by an upcoming
  # toolchain bump surfaces here before rust-toolchain.toml is ever touched.
  # This job is not a required check — the pinned `test` job above is what
  # gates merges.
  test-next-stable:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - name: Run tests
        run: cargo test --workspace
