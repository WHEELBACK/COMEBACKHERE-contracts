# cargo-deny configuration
# https://embarkstudios.github.io/cargo-deny/

[advisories]
# Deny crates with known security vulnerabilities
version = 2
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
# The advisory database is updated independently of this repo, so the weekly
# re-check in `.github/workflows/deny.yml` can flag a crate pinned in
# Cargo.lock even when nothing here changed. Every ignore entry must name the
# advisory, say why it is not actionable from this repo, and say when to
# remove it.
ignore = [
  # Reaches us only through soroban-sdk 29.0.1 -> soroban-env-host -> k256/p256
  # -> elliptic-curve 0.13.8 -> crypto-bigint 0.5.5 (host/test-only; not compiled
  # into on-chain WASM contracts). elliptic-curve 0.13.8 pins crypto-bigint ^0.5,
  # so the upgrade must come from upstream soroban-env-host. Remove once a
  # soroban-sdk upgrade moves past crypto-bigint 0.5.x.
  "RUSTSEC-2026-0387",
]

[licenses]
version = 2
# Allow common permissive and copyleft-compatible licenses
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-DFS-2016",
  "Unicode-3.0",
  "CC0-1.0",
  "0BSD",
]

[bans]
# Deny duplicate versions of the same crate where possible
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
