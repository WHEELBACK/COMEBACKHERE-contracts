# cargo-deny configuration.
#
# See https://embarkstudios.github.io/cargo-deny/ for the full reference.

[advisories]
# The advisory database is updated independently of this repo, so a weekly
# re-check can surface a new advisory against a dependency that is pinned in
# Cargo.lock even when nothing here changed.
#
# Each ignore entry below must be documented with the advisory ID and the
# reason it is not actionable from this repository.
ignore = [
    # RUSTSEC-2024-0436: `paste` is unmaintained (no security vulnerability,
    # only an unmaintained-crate warning). It is pulled in transitively by
    # soroban-sdk's proc-macro stack and cannot be upgraded from this repo
    # until upstream drops it. Tracked upstream; remove this entry once
    # soroban-sdk no longer depends on `paste`.
    "RUSTSEC-2024-0436",
]
