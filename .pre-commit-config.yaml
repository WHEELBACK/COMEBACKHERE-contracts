repos:
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --all -- --check
        language: system
        pass_filenames: false
      - id: cargo-clippy
        name: cargo clippy
        entry: cargo clippy -- -D warnings
        language: system
        pass_filenames: false
      - id: check-enum-ordering
        name: Check append-only enum ordering
        entry: scripts/check-enum-ordering.sh
        language: script
        pass_filenames: false
